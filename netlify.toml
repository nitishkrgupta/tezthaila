# Netlify root configuration for Tez Thaila
# Used when the user links the root GitHub repository to Netlify

[build]
  base = "client"
  command = "npm run build"
  publish = "dist/client-ng/browser"

# SPA Catch-all rule: Allows Angular client-side router to handle all page navigations
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
